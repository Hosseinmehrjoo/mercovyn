services:
  db:
    image: mariadb:11.4
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: mercovyn
      MYSQL_USER: mercovyn
      MYSQL_PASSWORD: mercovyn
    ports:
      - "3307:3306"
    volumes:
      - mercovyn_db:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build:
      context: ..
      dockerfile: deploy/docker/Dockerfile.local
    working_dir: /app
    command: sh -c "php deploy/write-local-config.php && php -S 0.0.0.0:8765 deploy/router-dev.php"
    volumes:
      - ..:/app
    ports:
      - "8765:8765"
    environment:
      MERCOVYN_DB_HOST: db
      MERCOVYN_DB_PORT: "3306"
      MERCOVYN_DB_NAME: mercovyn
      MERCOVYN_DB_USER: mercovyn
      MERCOVYN_DB_PASS: mercovyn
    depends_on:
      db:
        condition: service_healthy

volumes:
  mercovyn_db: