# Mercovyn — standalone vhost (does not affect shomaredar.ir)
# Canonical host: https://www.mercovyn.com/
limit_req_zone $binary_remote_addr zone=mercovyn_login:10m rate=8r/m;

server {
    listen 80;
    listen [::]:80;
    server_name mercovyn.com www.mercovyn.com;

    location ^~ /.well-known/acme-challenge/ {
        root /opt/mercovyn;
        allow all;
    }

    location / {
        return 301 https://www.mercovyn.com$request_uri;
    }
}

# Apex → www (HTTPS)
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name mercovyn.com;

    ssl_certificate     /etc/letsencrypt/live/mercovyn.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mercovyn.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    return 301 https://www.mercovyn.com$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.mercovyn.com;

    ssl_certificate     /etc/letsencrypt/live/mercovyn.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mercovyn.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    root /opt/mercovyn;
    index index.php index.html;

    client_max_body_size 12M;

    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml font/woff font/woff2 text/xml application/xml;
    gzip_proxied any;

    open_file_cache max=5000 inactive=60s;
    open_file_cache_valid 120s;
    open_file_cache_min_uses 2;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location = /backend/admin/videos-upload.php {
        client_max_body_size 12M;
        try_files $uri =404;
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.5-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param HTTPS on;
        fastcgi_param HTTP_X_FORWARDED_PROTO $http_x_forwarded_proto;
        fastcgi_read_timeout 900s;
        fastcgi_send_timeout 900s;
        include fastcgi_params;
    }

    location = /backend/install.php { return 404; }

    location = /sitemap.xml { rewrite ^ /index.php last; }
    location = /llms.txt { rewrite ^ /index.php last; }

    location ~ ^/backend/(admin/login\.php|api/auth\.php)$ {
        limit_req zone=mercovyn_login burst=5 nodelay;
        try_files $uri =404;
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.5-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param HTTPS on;
        fastcgi_param HTTP_X_FORWARDED_PROTO $http_x_forwarded_proto;
        include fastcgi_params;
    }

    location ~ /\.(git|env|ht|user\.ini) { return 404; }
    location ~* \.(sql|bak|pem|key|lock)$ { return 404; }
    location = /backend/config.php { return 404; }
    location = /backend/config.sample.php { return 404; }
    location ~ ^/backend/(lib|install\.sql|install-seed\.sql)/ { return 404; }

    location ~* \.(css|js|jpg|jpeg|png|gif|webp|svg|ico|woff|woff2|ttf|eot|map)$ {
        try_files $uri =404;
        access_log off;
        expires 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.5-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param HTTPS on;
        fastcgi_param HTTP_X_FORWARDED_PROTO $http_x_forwarded_proto;
        fastcgi_read_timeout 300s;
        include fastcgi_params;
    }
}